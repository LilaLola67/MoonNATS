name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.18+6c83a7f62'
          core-version: '0.10.18+6c83a7f62'
      - run: moon version --all
      - run: moon fmt --check
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon build --target ${{ matrix.target }}
      - run: moon test --target ${{ matrix.target }}
      - run: moon run cmd/main --target ${{ matrix.target }}
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.18+6c83a7f62'
          core-version: '0.10.18+6c83a7f62'
      - run: python -m pip install -r scripts/requirements-test.txt
      - run: python scripts/download_server.py
      - run: python scripts/test_all.py
